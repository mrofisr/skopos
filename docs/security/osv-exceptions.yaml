# OSV/govulncheck exceptions for the alpha release gate.
#
# Every entry needs a recognized advisory id, a one-line reason, and an expiry
# date. The checker fails on an unknown id, a missing reason or expiry, a
# duplicate id, malformed content, or an entry past its expiry date.
#
# Schema (strict):
#
#   exceptions: []
#
# or:
#
#   exceptions:
#     - id: GO-2026-0001      # GO-, CVE-, GHSA-, or OSV-
#       reason: why the finding is not exploitable in Skopos
#       expires: 2027-01-31   # last day the exception is valid, inclusive
#
# Run `go run ./tools/repoctl osv` after editing this file.
exceptions: []
