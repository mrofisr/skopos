nameOverride: ""
fullnameOverride: ""

# Optional HTTP Basic authentication on the public gateway API. /healthz and
# /readyz stay unauthenticated for Kubernetes probes. Basic auth is only safe
# over TLS; terminate TLS at an ingress or proxy. Disabled by default.
auth:
  enabled: false
  # Preferred: existing Secret with keys username and password.
  existingSecret: ""
  # Inline values are rendered into a Secret, not into a ConfigMap. Use only
  # when you are not providing existingSecret.
  username: ""
  password: ""

# Optional semantic context catalog served at /api/v1/context. The catalog is
# operator-authored JSON; no metric metadata is inferred by the gateway.
context:
  enabled: false
  # Read observed metric type/unit/description from ClickHouse for unknown
  # metrics. This is labeled known:false + observed_only; it never overrides
  # the explicit catalog.
  observed: true
  # Preferred: an existing ConfigMap with a catalog.json key.
  existingConfigMap: ""
  # Inline catalog JSON. Rendered into a ConfigMap when existingConfigMap is
  # empty. Keep it small; the API returns compact projections.
  catalog: ""

# ClickHouse single-node. HA and replication are out of scope for v0.1.
clickhouse:
  image:
    repository: clickhouse/clickhouse-server
    tag: 26.8.36.3
    digest: sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    pullPolicy: IfNotPresent
  database: otel
  tables:
    traces: otel_traces
    logs: otel_logs
    metricsGauge: otel_metrics_gauge
    metricsSum: otel_metrics_sum
    metricsHistogram: otel_metrics_histogram
    metricsExponentialHistogram: otel_metrics_exponential_histogram
    metricsSummary: otel_metrics_summary
  dedup:
    # Full replay dedup for logs and metrics: ReplacingMergeTree plus a
    # 16-byte full-row hash. Set false for the fast profile: MergeTree, no row
    # hash, at-least-once replay. Trace identity dedup is always on.
    enabled: true
  ttl:
    tracesDays: 7
    logsDays: 7
    metricsDays: 30
  # Optional tiered storage. Disabled means the schema keeps today's
  # local-only TTL/delete behavior and no S3 configuration is mounted.
  # When enabled, all signal tables use the `tiered` storage policy and this
  # hotDays/totalDays pair replaces the per-signal clickhouse.ttl values.
  storage:
    enabled: false
    # Local hot disk/volume and S3-backed cold volume names. Keep them
    # distinct; `default` and `cold_s3` are reserved by the generated config.
    hotVolume: hot
    coldVolume: cold
    hotDays: 3
    totalDays: 30
    # Local file cache in front of the S3 disk. Lives on the ClickHouse PVC.
    cacheSize: 10Gi
    cold:
      # Scheme and host only, for example http://rustfs.observability:9000.
      # The chart appends bucket/prefix. The bucket must already exist.
      endpoint: ""
      bucket: ""
      prefix: "skopos/cold"
      region: ""
      # Prefer existingSecret with keys access-key-id and secret-access-key.
      # Inline credentials are only used when existingSecret is empty; the
      # chart renders them into a Secret, never into the ConfigMap.
      existingSecret: ""
      accessKeyId: ""
      secretAccessKey: ""
  # Optional scheduled full backup to a separate S3 destination. Backups are
  # for disaster recovery: the gateway does not query this path, restore first.
  backup:
    enabled: false
    schedule: "0 2 * * *"
    activeDeadlineSeconds: 3600
    startingDeadlineSeconds: 600
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 1
    # clickhouse-client runs from the pinned ClickHouse image by default.
    # Keep this in sync with clickhouse.image when bumping ClickHouse.
    image:
      repository: clickhouse/clickhouse-server
      tag: 26.8.36.3
      digest: sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
      pullPolicy: IfNotPresent
    # Must not overlap the live cold tier when storage.enabled is true; the
    # chart refuses to render an overlapping destination.
    endpoint: ""
    bucket: ""
    prefix: "skopos/backups"
    region: ""
    existingSecret: ""
    accessKeyId: ""
    secretAccessKey: ""
    # Optional CronJob that applies a bucket lifecycle rule for the backup
    # prefix. It replaces the backup bucket's existing lifecycle
    # configuration; use a dedicated bucket or manage lifecycle rules
    # yourself. The rule targets <prefix>/ and leaves <prefix>_state/ alone.
    lifecycle:
      enabled: false
      schedule: "0 3 * * *"
      activeDeadlineSeconds: 300
      startingDeadlineSeconds: 300
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 3
      retentionDays: 30
      abortIncompleteMultipartUploadDays: 7
      image:
        repository: amazon/aws-cli
        tag: 2.31.7
        digest: sha256:8173c3c7c71e25b0824025b90a85df6e24c696f646498dca9dd370ea446e4fc8
        pullPolicy: IfNotPresent
    # Optional CronJob that restores the latest backup into a temporary
    # database, checks that every table is queryable, then drops it. The
    # backup job writes the latest timestamp to <prefix>_state/<database>.tsv.
    restoreDrill:
      enabled: false
      schedule: "0 4 * * *"
      activeDeadlineSeconds: 3600
      startingDeadlineSeconds: 600
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
  persistence:
    size: 50Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  service:
    type: ClusterIP
    httpPort: 8123
    nativePort: 9000
  auth:
    # If set, this Secret must contain admin-password and gateway-password.
    existingSecret: ""
    adminUser: default
    gatewayUser: skopos_gateway
  limits:
    maxExecutionTimeSeconds: 30
    maxMemoryUsageBytes: 1073741824
    maxRowsToRead: 10000000
    maxResultRows: 200000
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  podSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    # The official image writes its generated user config into /etc on first
    # boot. Keep the root filesystem writable in alpha; see docs/install.md.
    readOnlyRootFilesystem: false
  initJob:
    backoffLimit: 6
    activeDeadlineSeconds: 600
  extraEnv: []

collector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.164.0
    digest: sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    pullPolicy: IfNotPresent
  # StatefulSet replicas. Each replica gets its own disk-backed queue PVC when
  # sendingQueue.persistence.enabled=true.
  replicas: 1
  service:
    type: ClusterIP
    grpcPort: 4317
    httpPort: 4318
    healthPort: 13133
  sendingQueue:
    numConsumers: 10
    queueSize: 50000
    batchMinSize: 5000
    batchFlushTimeout: 5s
    # Disk-backed queue shared by the ClickHouse and checkpoint exporters.
    # Each Collector replica gets its own PVC, so queued batches survive
    # restarts and rescheduling without multiple writers sharing a volume.
    # The checkpoint WAL remains the durable S3 layer.
    storageSize: 5Gi
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
      retentionPolicy:
        # Retain queue PVCs when a replica is deleted or scaled down. This keeps
        # queued telemetry available for inspection or manual replay; clean them
        # up explicitly after the outage window.
        whenDeleted: Retain
        whenScaled: Retain
  memoryLimiter:
    # Keep the Collector below its 1Gi limit and apply backpressure before the
    # kernel OOM killer can drop in-flight telemetry.
    checkInterval: 1s
    limitMiB: 700
    spikeLimitMiB: 100
  otlpAuth:
    # Require a bearer token on the OTLP gRPC/HTTP receivers. OBI reads the
    # matching OTEL_EXPORTER_OTLP_HEADERS value from the same Secret. Prefer
    # existingSecret; inline token is rendered into a Secret but also appears
    # in Helm values. Bearer tokens are only as safe as the transport: use
    # TLS at the ingress or mTLS for untrusted networks.
    enabled: false
    existingSecret: ""
    token: ""
    tokenKey: token
    headersKey: otlp-headers
  tls:
    # Server TLS for the OTLP gRPC/HTTP receivers. The Secret must contain
    # tls.crt, tls.key, and ca.crt. For mTLS it must also contain client.crt
    # and client.key for OBI. The server certificate must include the
    # Collector service DNS name in its SANs.
    enabled: false
    existingSecret: ""
    mtls: false
    minVersion: "1.2"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    minAvailable: ""
  extraEnv: []

# Optional recent-window durability checkpoint. When enabled, the Collector
# fans every OTLP signal out to this service in addition to ClickHouse. The
# service ACKs after a local WAL write, seals and gzip-uploads segments to S3,
# and can replay them through the Collector after ClickHouse loss. It is not a
# backup, a data lake, or a query path; see docs/checkpoint.md.
checkpoint:
  enabled: false
  # Reuses gateway.image: the Skopos image contains one /skopos binary and
  # SKOPOS_MODE selects the role. Pin gateway.image.digest for release installs.
  replicas: 1
  service:
    type: ClusterIP
    port: 4319
  # Local WAL volume. Keep this larger than maxLocalBytes plus filesystem
  # reserve. The StatefulSet gives each replica its own ReadWriteOnce volume,
  # so replicas never share an active WAL.
  persistence:
    size: 2Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  # Seal the active segment after this many payload bytes or this interval,
  # whichever comes first. The unshipped window is bounded by
  # max(sealBytes, arrival_rate * sealInterval); see docs/checkpoint.md.
  sealBytes: 8388608
  sealInterval: 15s
  maxLocalBytes: 1073741824
  maxRequestBytes: 16777216
  flushTimeout: 15s
  logLevel: info
  s3:
    # Scheme and host only, for example http://rustfs.observability:9000.
    # The bucket must already exist; the chart does not create it.
    endpoint: ""
    bucket: ""
    # Set an S3 lifecycle expiration on this prefix as a backstop for objects
    # that are never replayed; keep it longer than the replay horizon.
    prefix: "skopos/checkpoint"
    region: "us-east-1"
    # Preferred: existing Secret with keys access-key-id and secret-access-key
    # and an optional session-token. Inline credentials are rendered into a
    # Secret, never into the StatefulSet. Leave both empty for an unsigned
    # S3-compatible endpoint.
    existingSecret: ""
    accessKeyId: ""
    secretAccessKey: ""
    sessionToken: ""
    # false uses path-style addressing (MinIO/RustFS default).
    virtualHost: false
    timeout: 60s
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  probes:
    liveness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 2
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 6
    # WAL recovery can take longer than a liveness window on a large volume.
    startup:
      initialDelaySeconds: 1
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
  # Shutdown budget is the 10 s HTTP drain plus flushTimeout. Keep this above
  # that sum so Kubernetes does not kill the final upload.
  terminationGracePeriodSeconds: 40
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    minAvailable: ""
  extraEnv: []

obi:
  # OBI is the Skopos auto-instrumentation agent. Set false on deployments
  # that do not need it; disabling removes the node-level agent and its
  # ~400MiB / 16m idle cost.
  enabled: true
  image:
    repository: otel/ebpf-instrument
    tag: v1.0.0
    digest: sha256:a68d70e934260f72540f157ccf4fb4adfa38f11de060d7d905696dad6a3fca02
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
  rbac:
    create: true
  hostPID: true
  batch:
    # Larger batches reduce gRPC/send overhead under load. The queue bounds
    # memory while the Collector is catching up.
    scheduleDelayMs: 5000
    maxExportBatchSize: 2048
    maxQueueSize: 8192
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 100m
      # Measured peak under a chart-deployed 20-request/s nginx + Istio load
      # was ~706Mi; 768Mi keeps the request above the loaded footprint.
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1Gi
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - BPF
        - CHECKPOINT_RESTORE
        - DAC_READ_SEARCH
        - NET_RAW
        - PERFMON
        - SYS_PTRACE
        # Required to join target process netns on containerd/k0s. Upstream
        # notes that unprivileged setups are runtime-dependent. This is a
        # security tradeoff; remove it only if your runtime can instrument
        # targets without it.
        - SYS_ADMIN
        # Required on kernels older than 5.11 to raise locked memory limits.
        - SYS_RESOURCE
  # Enabling trace-context propagation adds NET_ADMIN. SYS_ADMIN is already
  # granted above for the target-netns join. See OBI's security documentation
  # before enabling it.
  contextPropagation: false
  clusterName: ""
  logLevel: info
  discovery:
    excludeSystemNamespaces: true
    # Extra OBI v2 capture rules, appended after the built-in exclusions.
    # Example:
    # extraRules:
    #   - action: include
    #     match:
    #       kubernetes:
    #         namespace_glob: ["shop"]
    #   - action: exclude
    #     match:
    #       kubernetes:
    #         namespace_glob: ["istio-system"]
    extraRules: []
  env: []
  mountTracefs: true
  tracefsHostPath: /sys/kernel/tracing
  cgroupHostPath: /sys/fs/cgroup

gateway:
  # The gateway is disabled by default so a default install never pulls a
  # mutable or unpublished image tag. Release installs enable it with the
  # digest-pinned values.release.yaml attached to the GitHub release. Local
  # development may enable it with a locally built image.
  enabled: false
  # all: query heads and public API in one process (default, current behavior).
  # frontend: proxy only, no ClickHouse. query/worker: internal query workers.
  mode: all
  replicaCount: 1
  # Kubernetes waits this long after SIGTERM before SIGKILL. Keep it above
  # clickhouse.limits.maxExecutionTimeSeconds + 10s so an in-flight query and
  # the HTTP drain can finish.
  terminationGracePeriodSeconds: 45
  image:
    repository: ghcr.io/mrofisr/skopos-gateway
    tag: dev
    # Release values must set a digest. Local development may leave it empty.
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  config:
    # ClickHouse query limits live under clickhouse.limits so the gateway
    # client and the read-only ClickHouse user cannot drift apart.
    maxResponseBytes: 67108864
    readinessTimeout: 2s
    maxRequestBytes: 1048576
    # Admission limits, per query head. The chart enables a conservative
    # default so a burst is rejected with 429/503 + Retry-After instead of
    # growing gateway memory. Set maxInflight to 0 to disable admission.
    maxInflight: 16
    queueDepth: 32
    queueWaitSeconds: 2
    # Range requests consume ceil(points / pointsPerSlot) units; instant
    # requests consume ceil(estimated rows / rowsPerSlot). Set pointsPerSlot or
    # rowsPerSlot to 0 to disable that path's weighting, or workWeighting to
    # false to make admission count-based for every request.
    pointsPerSlot: 100
    rowsPerSlot: 200000
    instantFallbackWeight: 8
    workWeighting: true
    # Cache metric discovery, table emptiness, and metadata.
    metadataTTL: 30s
    # Expose the auth-protected /debug/pprof routes. Off by default.
    profile: false
    # Required to expose pprof when gateway auth is disabled. Prefer enabling
    # auth; this is only for local and benchmark stacks.
    profileAllowUnauth: false
    logLevel: info
  # Optional Go memory limit. When empty, the chart uses 90% of
  # resources.limits.memory. A Kubernetes quantity such as 200Mi or 1Gi.
  goMemLimit: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1536Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  probes:
    liveness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 2
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    minAvailable: ""
  extraEnv: []

# Metrics
metrics:
  serviceMonitor:
    # Requires the Prometheus Operator CRDs. Disabled by default.
    enabled: false
    interval: 30s
    additionalLabels: {}
    # The selector must match the Service labels; empty is rejected.
    selector: {}
  prometheusRule:
    # Requires the Prometheus Operator CRDs. Disabled by default.
    enabled: false
    # Labels used by the Prometheus ruleSelector.
    additionalLabels: {}
    # Base URL for alert runbook links. Set to "" to omit the annotation.
    runbookURL: https://github.com/mrofisr/skopos/blob/development/docs/monitoring.md
    # Extra rules appended to the skopos.rules group.
    additionalRules: []
  dashboards:
    # Requires Grafana's dashboard sidecar or a manual ConfigMap import. The
    # dashboard JSON lives in deploy/helm/skopos/dashboards/.
    enabled: false
    # Sidecar label. Match the Grafana sidecar's folder/label selector.
    labels:
      grafana_dashboard: "1"
    annotations: {}
    # Optional Grafana folder name for the dashboard sidecar.
    folder: ""

# Split the read path into a public frontend and an internal query tier. When
# disabled, the single gateway Deployment/Service above is rendered unchanged.
distributed:
  enabled: false

# Public frontend tier (used only when distributed.enabled=true). It reuses the
# gateway image, security context, probes, and shared config values.
frontend:
  replicaCount: 1
  # Keep above frontend.config.queryTimeout + 10s.
  terminationGracePeriodSeconds: 45
  service:
    type: ClusterIP
    port: 8080
  config:
    # Bounded timeout for each proxied query request.
    queryTimeout: 30s
    # Timeout for probing query workers' /readyz from the frontend. Keep this
    # below gateway.probes.readiness.timeoutSeconds so the kubelet probe does
    # not time out first.
    readinessTimeout: 1s
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    minAvailable: ""
  extraEnv: []

# Internal query worker tier (used only when distributed.enabled=true). Worker
# pods use the same ClickHouse credentials and limits as the single gateway.
query:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1536Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    minAvailable: ""
  extraEnv: []

networkPolicy:
  enabled: true
  gateway:
    # NetworkPolicyPeer list. The default allows any namespace to reach the
    # gateway on its service port. Tighten this to your Grafana namespace.
    allowFrom:
      - namespaceSelector: {}
  clickhouse:
    allowCollector: true
    allowGateway: true
    allowInitJob: true
  collector:
    allowObi: true
    # OTLP clients (applications and log forwarders) may live in other
    # namespaces. Tighten this to the namespaces that send telemetry.
    allowFrom:
      - namespaceSelector: {}
  obi:
    denyIngress: true

serviceAccount:
  create: true
  annotations: {}
  name: ""

commonLabels: {}
