{{- if and .Values.gateway.enabled (not .Values.distributed.enabled) .Values.gateway.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "skopos.gateway.fullname" . }}
  labels:
    {{- include "skopos.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- with .Values.gateway.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- else }}
  maxUnavailable: {{ .Values.gateway.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "skopos.componentLabels" (dict "root" . "component" "gateway") | nindent 6 }}
---
{{- end }}
