{{- if and .Values.collector.enabled .Values.collector.sendingQueue.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "skopos.collector.fullname" . }}-queue
  labels:
    {{- include "skopos.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.collector.sendingQueue.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.collector.sendingQueue.persistence.size }}
{{- end }}
