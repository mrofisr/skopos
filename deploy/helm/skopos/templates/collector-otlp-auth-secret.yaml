{{- if and .Values.collector.enabled .Values.collector.otlpAuth.enabled (not .Values.collector.otlpAuth.existingSecret) }}
{{- $auth := .Values.collector.otlpAuth }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skopos.collector.otlpAuthSecretName" . }}
  labels:
    {{- include "skopos.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
type: Opaque
stringData:
  {{ $auth.tokenKey }}: {{ $auth.token | quote }}
  {{ $auth.headersKey }}: {{ printf "Authorization=Bearer %s" $auth.token | quote }}
{{- end }}
