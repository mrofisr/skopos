name: skopos-obi-e2e

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 40
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "${SKOPOS_E2E_CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "${SKOPOS_E2E_CLICKHOUSE_NATIVE_PORT:-19000}:9000"

  clickhouse-init:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/init-clickhouse.sh"]
    environment:
      CLICKHOUSE_ADMIN_USER: default
      CLICKHOUSE_ADMIN_PASSWORD: ""
      SKOPOS_DATABASE: otel
      SKOPOS_GATEWAY_USER: skopos_gateway
      SKOPOS_GATEWAY_PASSWORD: ${SKOPOS_E2E_GATEWAY_PASSWORD:-skopos-e2e-password}
    volumes:
      - ./.render/schema.sql:/schema/schema.sql:ro
      - ./.render/migrate.sh:/schema/migrate.sh:ro
      - ../../../scripts/e2e/obi/init-clickhouse.sh:/init/init-clickhouse.sh:ro
    restart: "no"

  seed:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DATABASE: otel
      CLICKHOUSE_ADMIN_USER: default
      CLICKHOUSE_ADMIN_PASSWORD: ""
      GRAFANA_SEED_SQL: /seed/grafana-seed.sql
      GRAFANA_TRACES_JSON: /seed/grafana-traces.json
    volumes:
      - ../../../scripts/e2e/obi/seed.sh:/seed/seed.sh:ro
      - ./.render/grafana-seed.sql:/seed/grafana-seed.sql:ro
      - ./.render/grafana-traces.json:/seed/grafana-traces.json:ro
    restart: "no"

  collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    volumes:
      - ./collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "13133"

  app:
    build:
      context: ./app
    ports:
      - "${SKOPOS_E2E_APP_PORT:-18080}:8080"

  obi:
    image: otel/ebpf-instrument:v1.0.0@sha256:a68d70e934260f72540f157ccf4fb4adfa38f11de060d7d905696dad6a3fca02
    pid: host
    privileged: true
    read_only: true
    depends_on:
      collector:
        condition: service_started
      app:
        condition: service_started
    environment:
      OTEL_EBPF_CONFIG_PATH: /config/obi-config.yml
      OTEL_EBPF_KUBE_METADATA_ENABLE: "false"
    volumes:
      - ./obi-config.yml:/config/obi-config.yml:ro
      - ${SKOPOS_E2E_TRACEFS:-/sys/kernel/tracing}:/sys/kernel/tracing
      - ${SKOPOS_E2E_CGROUPFS:-/sys/fs/cgroup}:/sys/fs/cgroup
    tmpfs:
      - /var/run/obi
      - /tmp

  gateway:
    build:
      context: ../../..
      dockerfile: Dockerfile
      args:
        VERSION: e2e
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      # Keep the gateway off port 8080: OBI selects the instrumented workload by
      # internal port, and with hostPID it can observe every container listening
      # on the selected port. The app owns 8080 in this harness.
      SKOPOS_LISTEN_ADDR: ":18081"
      SKOPOS_CLICKHOUSE_URL: http://clickhouse:8123
      SKOPOS_CLICKHOUSE_DATABASE: otel
      SKOPOS_CLICKHOUSE_USER: skopos_gateway
      SKOPOS_CLICKHOUSE_PASSWORD: ${SKOPOS_E2E_GATEWAY_PASSWORD:-skopos-e2e-password}
      SKOPOS_AUTH_ENABLED: ${SKOPOS_E2E_GATEWAY_AUTH:-false}
      SKOPOS_AUTH_USERNAME: ${SKOPOS_E2E_AUTH_USERNAME:-}
      SKOPOS_AUTH_PASSWORD: ${SKOPOS_E2E_AUTH_PASSWORD:-}
      SKOPOS_LOG_LEVEL: info
    ports:
      - "${SKOPOS_E2E_GATEWAY_PORT:-18081}:18081"

  tempo:
    image: grafana/tempo:2.7.2@sha256:4b0277a9b572a4b1fa43b01468e58911ec214dd69d033f2cd476596d14de9fe3
    command: -config.file=/etc/tempo.yaml
    ports:
      - "127.0.0.1:${SKOPOS_E2E_TEMPO_PORT:-18095}:3200"
      - "127.0.0.1:${SKOPOS_E2E_TEMPO_OTLP_PORT:-18096}:4318"
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:3.5.7@sha256:0eaee7bf39cc83aaef46914fb58f287d4f4c4be6ec96b86c2ed55719a75e49c8
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:${SKOPOS_E2E_LOKI_PORT:-18094}:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    user: "0"
    command:
      - "--storage.tsdb.path=/prometheus"
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=20000d"
    ports:
      - "127.0.0.1:${SKOPOS_E2E_PROMETHEUS_PORT:-18093}:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./.render/prometheus:/seed:ro
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${SKOPOS_E2E_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${SKOPOS_E2E_GRAFANA_PORT:-13000}:3000"
    volumes:
      - ./.render/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  clickhouse-data:
  prometheus-data:
